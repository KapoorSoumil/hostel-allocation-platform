services:
  database:
    image: postgres:16-alpine
    container_name: hostel-allocation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hostel_allocation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hostel_allocation"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hostel-allocation-backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@database:5432/hostel_allocation?schema=public
      DIRECT_URL: postgresql://postgres:postgres@database:5432/hostel_allocation?schema=public
      JWT_ACCESS_SECRET: replace-with-a-long-random-production-access-secret
      JWT_REFRESH_SECRET: replace-with-a-long-random-production-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: "true"
      LOG_LEVEL: info
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: hostel-allocation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
